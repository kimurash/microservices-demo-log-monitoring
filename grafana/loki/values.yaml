loki:
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage_config:
    aws:
      region: ap-northeast-1
      bucketnames: loki-ms-demo-chunks
      s3forcepathstyle: false
  ingester:
    chunk_encoding: snappy
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 24h
  compactor:
    retention_enabled: true
    delete_request_store: s3
  ruler:
    enable_api: true
    storage:
      type: s3
      s3:
        region: ap-northeast-1
        bucketnames: loki-ms-demo-ruler
        s3forcepathstyle: false
      # alertmanager_url: <URL> # The URL of the Alertmanager to send alerts (Prometheus, Mimir, etc.)

  querier:
    max_concurrent: 4

  storage:
    type: s3
    bucketNames:
      chunks: "loki-ms-demo-chunks"
      ruler: "loki-ms-demo-ruler"
      # admin: "<s3 bucket name>" # GEL customers only
    s3:
      region: ap-northeast-1
      insecure: false
    s3forcepathstyle: false

serviceAccount:
  create: true
  name: loki
  annotations:
    "eks.amazonaws.com/role-arn": "arn:aws:iam::376408658421:role/LokiServiceAccountRole" # The service role you created

deploymentMode: SimpleScalable

backend:
  replicas: 2
  maxUnavailable: 1
  persistence:
    storageClass: gp3
read:
  replicas: 2
  maxUnavailable: 1
  persistence:
    storageClass: gp3
write:
  replicas: 3 # To ensure data durability with replication
  maxUnavailable: 2
  persistence:
    storageClass: gp3

# This exposes the Loki gateway so it can be written to and queried externaly
gateway:
  service:
    type: LoadBalancer
  basicAuth:
    enabled: true
    existingSecret: loki-basic-auth

# Since we are using basic auth, we need to pass the username and password to the canary
lokiCanary:
  extraArgs:
    - -pass=$(LOKI_PASS)
    - -user=$(LOKI_USER)
  extraEnv:
    - name: LOKI_PASS
      valueFrom:
        secretKeyRef:
          name: canary-basic-auth
          key: password
    - name: LOKI_USER
      valueFrom:
        secretKeyRef:
          name: canary-basic-auth
          key: username

# Enable minio for storage
minio:
  enabled: false
